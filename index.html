  <label><input type="checkbox" id="chkKunden" checked> 🔷 Pellethändler</label><br>
  <label><input type="checkbox" id="chkSackKunden" checked> 🟣 Sackwaren Händler</label><br>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =====================
   GRUNDKARTE INITIALISIEREN
===================== */

const map = L.map("map").setView([51, 11], 5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  minZoom: 4,
  maxZoom: 18,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);



/* =====================
   HILFSFUNKTION: FARBE FÜR PREISE
===================== */

function colorForPrice(p, keinPreis) {
  if (keinPreis) return "#9e9e9e";
  if (!p || p <= 0 || isNaN(p)) return "#9e9e9e";
  if (p <= 260) return "green";
  if (p < 285) return "orange";
  return "red";
}



/* =====================
   GEOCODE CACHE
===================== */

const geoCache = JSON.parse(localStorage.getItem("geoCachePellets_EU") || "{}");

async function geocode(q) {
  if (geoCache[q] && geoCache[q].country_code) {
    return geoCache[q];
  }

  const r = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(q)}&limit=1&accept-language=de`
  );
  const d = await r.json();

  if (d.length) {
    const item = d[0];
    const obj = {
      lat: +item.lat,
      lon: +item.lon,
      country: item.address?.country || "",
      country_code: item.address?.country_code?.toLowerCase() || ""
    };
    geoCache[q] = obj;
    localStorage.setItem("geoCachePellets_EU", JSON.stringify(geoCache));
    return obj;
  }

  console.warn("Kein Geocode-Treffer:", q);
  return null;
}



/* =====================
   KUNDEN-ICONS
===================== */

const blauesDreieck = L.divIcon({
  className: "custom-triangle",
  html: `<svg width="24" height="24"><polygon points="12,2 22,22 2,22" fill="blue" stroke="black" stroke-width="1"/></svg>`,
  iconAnchor: [12,22]
});

const lilaDreieck = L.divIcon({
  className: "custom-triangle-purple",
  html: `<svg width="24" height="24"><polygon points="12,2 22,22 2,22" fill="purple" stroke="black" stroke-width="1"/></svg>`,
  iconAnchor: [12,22]
});

const orangeDreieck = L.divIcon({
  className: "custom-triangle-orange",
  html: `<svg width="24" height="24"><polygon points="12,2 22,22 2,22" fill="orange" stroke="black" stroke-width="1"/></svg>`,
  iconAnchor: [12,22]
});



/* =====================
   GOOGLE SHEET DATEN
===================== */

const sheetUrlFirmen =
  "https://docs.google.com/spreadsheets/d/1f1oD1TlYWPRbD12d05yIGkqmXVygVt3ZHLk9U0bKoTs/export?format=csv";

const sheetUrlKunden =
  "https://docs.google.com/spreadsheets/d/1DaiLyZbhJkdSQ1PHbJQmguIrDnGrrhiAVgJC4PJO8vA/export?format=csv&gid=0";

let werke = [];
let kunden = [];
let alleMarker = [];
let selectedPoints = [];
let routeLine = null;
let avgPriceByCountry = {};
let searchResultMarker = null;



/* =====================
   CSV → JSON (Firmen)
===================== */

function parseFirmenWithHeader(rows) {
  const lc = (s) => String(s || "").toLowerCase();
  const keys = Object.keys(rows[0] || {});

  const findKey = (names) =>
    keys.find((k) => names.includes(lc(k)));

  const nameKey = findKey(["firma","name","werk"]) || keys[0];
  const ortKey  = findKey(["ort","stadt","location","standort","adresse"]) || keys[1];

  const preisKey = findKey(["preis","price","€/t","euro","euro_t","werkspreis"]);
  const sackPreisKey = findKey(["preis_sack","preis sack","sackpreis","bag_price","sackwarepreis","sackware preis","preis_e"]);

  const zertKey = findKey(["zertifikate","zertifikat","zert","cert"]);
  const sackKey = findKey(["sackware","sack","bag","bagged"]);

  return rows
    .filter(r => (r[nameKey] || "").trim() && (r[ortKey] || "").trim())
    .map(r => ({
      firma: r[nameKey].trim(),
      ort: r[ortKey].trim(),
      preis: parseFloat(String(r[preisKey] || "0").replace(",", ".")),
      preisSack: parseFloat(String(r[sackPreisKey] || "0").replace(",", ".")),
      zert: (r[zertKey] || "").trim(),
      sack: (r[sackKey] || "").trim()
    }));
}



/* =====================
   GOOGLE-TABELLEN LADEN
===================== */

async function ladeDaten() {

  const firmenPromise = new Promise((resolve) => {
    Papa.parse(sheetUrlFirmen, {
      download: true,
      header: true,
      complete: (r) => {
        let daten = [];

        if (r.data && r.data.length && Object.keys(r.data[0]).length > 1) {
          daten = parseFirmenWithHeader(r.data);
        }

        resolve(normalizePreise(daten));
      }
    });
  });

  const kundenPromise = new Promise((resolve) => {
    Papa.parse(sheetUrlKunden, {
      download: true,
      header: true,
      complete: (r) => {
        const h = Object.keys(r.data[0] || {});
        const nameKey = h.find(x => x.toLowerCase().includes("name")) || "name";
        const ortKey = h.find(x =>
          ["ort","adresse","standort","stadt"].includes(x.toLowerCase())
        ) || "ort";

        const kundenDaten = r.data
          .map(x => ({
            name: x[nameKey]?.trim() || "",
            ort:  x[ortKey]?.trim() || "",
            lose: (x["lose"] || "").trim().toLowerCase(),
            sackware: (x["sackware"] || "").trim().toLowerCase(),
            sonstige: (x["sonstige"] || "").trim().toLowerCase()
          }))
          .filter(x => x.name && x.ort);

        resolve(kundenDaten);
      }
    });
  });

  [werke, kunden] = await Promise.all([firmenPromise, kundenPromise]);
}



/* =====================
   PREISE NORMALISIEREN
===================== */

function normalizePreise(list) {

  const echteWerk = list.filter(w => w.preis > 0);
  const echteSack = list.filter(w => w.preisSack > 0);

  const avgWerk = echteWerk.length
    ? echteWerk.reduce((a,b) => a + b.preis, 0) / echteWerk.length
    : 0;

  const avgSack = echteSack.length
    ? echteSack.reduce((a,b) => a + b.preisSack, 0) / echteSack.length
    : 0;

  return list.map(w => {
    w.keinPreisWerk = !(w.preis > 0);
    w.keinPreisSack = !(w.preisSack > 0);

    if (w.keinPreisWerk) w.preis = avgWerk;
    if (w.keinPreisSack) w.preisSack = avgSack;

    w.farbeWerk = colorForPrice(w.preis, w.keinPreisWerk);
    w.farbeSack = colorForPrice(w.preisSack, w.keinPreisSack);

    return w;
  });
}



/* =====================
   DURCHSCHNITT PRO LAND
===================== */

function berechneDurchschnittProLand(){
  const sums = {};
  const counts = {};

  alleMarker.forEach(m => {
    if (m.type !== "firma") return;

    const cc = m.country_code;
    if (!cc) return;

    // WICHTIG:
    // Firmen mit KEINEM echten Preis → nicht zählen
    if (m.keinPreisWerk) return;

    if (!sums[cc]) { sums[cc] = 0; counts[cc] = 0; }
    sums[cc] += m.preis;
    counts[cc] += 1;
  });

  avgPriceByCountry = {};

  Object.keys(sums).forEach(cc => {
    avgPriceByCountry[cc] =
      counts[cc] > 0 ? (sums[cc] / counts[cc]) : null;
  });
}



/* =====================
   TOOLTIP FUNKTION
===================== */

function tooltipHtmlFromMarker(m){
  const useSack = sackFilterAktiv();
  const preisNow = useSack ? m.preisSack : m.preis;

  const avg = avgPriceByCountry[m.country_code];

  return `
    <b>${m.firma}</b><br>
    ${m.ort}<br>
    <b>Preis:</b> ${preisNow?.toFixed(2)} €<br>
    ${avg ? `<b>Landesdurchschnitt:</b> ${avg.toFixed(2)} €` : ""}
  `;
}



/* =====================
   KARTE AUFBAUEN
===================== */

async function buildMap(){
  alleMarker = [];
  const bounds = L.latLngBounds();

  /* ---- Werke ---- */
  for(const w of werke){
    const c = geoCache[w.ort] || await geocode(w.ort);
    if(!c) continue;

    const farbe = w.farbeWerk;

    const m = L.circleMarker([c.lat, c.lon], {
      radius: 8,
      color: farbe,
      fillColor: farbe,
      fillOpacity: 0.85
    })
    .bindTooltip("", {sticky:true})
    .on("tooltipopen", () => {
      m.getTooltip().setContent(
        tooltipHtmlFromMarker({
          firma: w.firma,
          ort: w.ort,
          preis: w.preis,
          preisSack: w.preisSack,
          country_code: c.country_code,
          keinPreisWerk: w.keinPreisWerk
        })
      );
    })
    .on("click", () => handleMarkerClick(w.firma, c));

    alleMarker.push({
      type: "firma",
      marker: m,
      firma: w.firma,
      ort: w.ort,
      preis: w.preis,
      preisSack: w.preisSack,
      keinPreisWerk: w.keinPreisWerk,
      country_code: c.country_code,
      sack: w.sack,
      zert: w.zert.toLowerCase()
    });

    bounds.extend([c.lat, c.lon]);
  }


  /* ---- Kunden ---- */
  for(const k of kunden){
    const c = geoCache[k.ort] || await geocode(k.ort);
    if(!c) continue;

    let icon = blauesDreieck;
    let type = "kunde";

    if (k.sonstige === "ja") { icon = orangeDreieck; type = "sonstige"; }
    else if (k.sackware === "ja" && k.lose !== "ja") { icon = lilaDreieck; type = "sackkunde"; }

    const m = L.marker([c.lat, c.lon], {icon})
      .bindTooltip(`<b>${k.name}</b><br>${k.ort}`)
      .on("click", () => handleMarkerClick(k.name, c));

    alleMarker.push({
      type,
      marker: m,
      name: k.name,
      ort: k.ort,
      country_code: c.country_code
    });

    bounds.extend([c.lat, c.lon]);
  }

  berechneDurchschnittProLand();

  if(bounds.isValid()) map.fitBounds(bounds.pad(0.15));

  updateLayers();
}




/* =====================
   LÄNDER-GEOJSON LADEN
===================== */

let countryGeoJson = null;
let countryLayer = null;

async function ensureCountryGeoJsonLoaded(){
  if (countryGeoJson) return;
  const r = await fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json");
  countryGeoJson = await r.json();
}



/* =====================
   FARBSTIL PRO LAND
===================== */

function getCountryStyle(avg){
  if (!avg || !isFinite(avg)) {
    return {
      color: "#333",
      weight: 1,
      fillColor: "transparent",
      fillOpacity: 0
    };
  }

  if (avg <= 260)
    return { color:"#004400", fillColor:"green", fillOpacity:0.3, weight:2 };

  if (avg < 285)
    return { color:"#aa5500", fillColor:"orange", fillOpacity:0.3, weight:2 };

  return { color:"#880000", fillColor:"red", fillOpacity:0.3, weight:2 };
}



/* =====================
   LANDES-DURCHSCHNITTS-ANZEIGE
===================== */

async function showCountryAveragePolygons(){

  // alle Marker ausblenden
  alleMarker.forEach(m => {
    if (map.hasLayer(m.marker)) map.removeLayer(m.marker);
  });

  await ensureCountryGeoJsonLoaded();

  if (countryLayer) {
    map.removeLayer(countryLayer);
    countryLayer = null;
  }

  const selected = getSelectedCountries();
  const noFilter = selected.length === 1 && selected[0] === "all";

  const relevant = [
    "de","at","pl","cz","fr","ch","se","dk","fi",
    "nl","lv","lt","ee","gb","be","sk","it"
  ];

  countryLayer = L.geoJSON(countryGeoJson, {
    filter: (f) => {
      const name = (f.properties.name || "").toLowerCase();
      const code = countryNameToCode[name];

      if (!code) return false;
      if (!relevant.includes(code)) return false;
      if (!noFilter && !selected.includes(code)) return false;

      return true;
    },
    style: (f) => {
      const name = (f.properties.name || "").toLowerCase();
      const code = countryNameToCode[name];
      const avg = avgPriceByCountry[code];
      return getCountryStyle(avg);
    },
    onEachFeature: (f, layer) => {
      const name = f.properties.name;
      const code = countryNameToCode[name.toLowerCase()];
      const avg = avgPriceByCountry[code];

      layer.bindTooltip(
        `<b>${name}</b><br>Durchschnitt: ${avg ? avg.toFixed(2)+" €" : "keine Daten"}`
      );
    }
  }).addTo(map);
}




/* =====================
   FILTER / MARKER ANZEIGEN
===================== */

function sackFilterAktiv(){
  return (
    document.getElementById("chkSackFireflies").checked ||
    document.getElementById("chkSack15kg").checked
  );
}

function getSelectedCountries(){
  const sel = [];
  document.querySelectorAll(".countryChk").forEach(ch => {
    if (ch.checked) sel.push(ch.value);
  });
  if (sel.includes("all")) return ["all"];
  return sel;
}

function hideCountryPolygons(){
  if (countryLayer) {
    map.removeLayer(countryLayer);
    countryLayer = null;
  }
}



/* ============================
   *** UPDATE LAYERS (deine neue Version)
============================ */

async function updateLayers(){

  hideCountryPolygons();

  // erst alle Marker ausblenden
  alleMarker.forEach(m => {
    if (map.hasLayer(m.marker)) map.removeLayer(m.marker);
  });

  const selectedCountries = getSelectedCountries();
  const noCountryFilter = selectedCountries.length === 1 && selectedCountries[0] === "all";

  const gruen  = document.getElementById("chkGruen").checked;
  const orange = document.getElementById("chkOrange").checked;
  const rot    = document.getElementById("chkRot").checked;
  const grau   = document.getElementById("chkGrau").checked;

  const kundenFlag      = document.getElementById("chkKunden").checked;
  const sackKundenFlag  = document.getElementById("chkSackKunden").checked;
  const sonstigeFlag    = document.getElementById("chkSonstigeKunden").checked;

  const useSack =
    document.getElementById("chkSackFireflies").checked ||
    document.getElementById("chkSack15kg").checked;

  // wenn ALLE Marker-Filter aus → Durchschnitt zeigen
  const anyMarkerFilters =
    gruen || orange || rot || grau ||
    kundenFlag || sackKundenFlag || sonstigeFlag;

  if (!anyMarkerFilters) {
    await showCountryAveragePolygons();
    return;
  }

  /* ========== Marker anzeigen ========== */

  for (const m of alleMarker) {

    // Kunden
    if (m.type === "kunde" && kundenFlag) {
      if (noCountryFilter || selectedCountries.includes(m.country_code)) {
        map.addLayer(m.marker);
      }
      continue;
    }

    if (m.type === "sackkunde" && sackKundenFlag) {
      if (noCountryFilter || selectedCountries.includes(m.country_code)) {
        map.addLayer(m.marker);
      }
      continue;
    }

    if (m.type === "sonstige" && sonstigeFlag) {
      if (noCountryFilter || selectedCountries.includes(m.country_code)) {
        map.addLayer(m.marker);
      }
      continue;
    }

    // Werke
    if (m.type === "firma") {

      // Sackware-Filter
      if (useSack) {
        const s = (m.sack || "").toLowerCase();
        const hasFire = s.includes("fireflies");
        const has15 = s.includes("15");
        if (document.getElementById("chkSackFireflies").checked && !hasFire) continue;
        if (document.getElementById("chkSack15kg").checked && !has15) continue;
      }

      // Zertifikate
      const en   = document.getElementById("chkEnPlus").checked;
      const din  = document.getElementById("chkDINplus").checked;
      const sure = document.getElementById("chkSURE").checked;
      const cpp  = document.getElementById("chkCPP").checked;
      const ohne = document.getElementById("chkOhneZert").checked;
      const z    = m.zert || "";

      let zertOK = false;
      if (z.includes("enplus") && en) zertOK = true;
      if (z.includes("dinplus") && din) zertOK = true;
      if (z.includes("sure")   && sure) zertOK = true;
      if (z.includes("cpp")    && cpp) zertOK = true;
      if (!z && ohne) zertOK = true;
      if (!zertOK) continue;

      const activeColor = useSack ? m.farbeSack : m.farbeWerk;

      if (activeColor === "green"  && !gruen) continue;
      if (activeColor === "orange" && !orange) continue;
      if (activeColor === "red"    && !rot) continue;
      if (activeColor === "#9e9e9e" && !grau) continue;

      if (!noCountryFilter && !selectedCountries.includes(m.country_code)) continue;

      m.marker.setStyle?.({ color: activeColor, fillColor: activeColor });
      map.addLayer(m.marker);
    }
  }
}
/* =====================
   MARKER-KLICK → ROUTENPUNKTE
===================== */

function handleMarkerClick(label, coord) {
  selectedPoints.push({ label, coord });

  if (selectedPoints.length === 2) {
    const [a, b] = selectedPoints;
    showRoute(a, b);
    selectedPoints = [];
  }
}



/* =====================
   LUFTLINIE (nur Fallback!)
===================== */

function luftlinieKm(a, b) {
  const R = 6371;
  const toRad = v => v * Math.PI / 180;

  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);

  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);

  const h = Math.sin(dLat/2)**2 +
            Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}



/* =====================
   STRASSEN-ROUTING (OSRM)
   — Keine Luftlinie außer wenn OSRM nichts findet!
===================== */

async function showRoute(a, b) {

  // OSRM erwartet lat,lon — NICHT lon,lat!
  const url = `https://router.project-osrm.org/route/v1/driving/` +
              `${a.coord.lon},${a.coord.lat};${b.coord.lon},${b.coord.lat}` +
              `?overview=full&geometries=geojson`;

  let found = false;

  try {
    const r = await fetch(url);
    if (r.ok) {
      const data = await r.json();
      if (data.routes && data.routes.length) {

        const route = data.routes[0];
        const dist = (route.distance / 1000).toFixed(1);

        const mins = route.duration / 60;
        const hours = Math.floor(mins / 60);
        const minutes = Math.round(mins % 60);
        const duration = hours > 0
          ? `${hours}h ${minutes}min`
          : `${minutes}min`;

        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

        const useSack = sackFilterAktiv();
        const f = werke.find(w => w.firma === a.label || w.firma === b.label);

        const preis = f ? (useSack ? f.preisSack : f.preis) : 0;

        const preisProKm = parseFloat(dist) < 250 ? 2.15 : 1.85;
        const teilstrecke = parseFloat(dist) / 24;
        const berechnung = teilstrecke * preisProKm;
        const gesamt = ((berechnung + preis) * 1.05).toFixed(2);

        if (routeLine) map.removeLayer(routeLine);

        routeLine = L.polyline(coords, {
          color: 'blue',
          weight: 5,
          opacity: 0.9
        }).addTo(map);

        const mid = coords[Math.floor(coords.length / 2)];

        L.popup()
          .setLatLng(mid)
          .setContent(`
            <b>Route:</b> ${a.label} ↔ ${b.label}<br>
            <b>Entfernung:</b> ${dist} km (Straße)<br>
            <b>Dauer:</b> ${duration}<br>
            <b>Preis pro km:</b> ${preisProKm.toFixed(2)} €<br>
            <b>Werk-/Sackpreis:</b> ${preis.toFixed(2)} €<br>
            <b>Gesamt:</b> <span style="color:green;font-size:1.1em">${gesamt} €</span>
          `)
          .openOn(map);

        map.fitBounds(routeLine.getBounds(), { padding: [40,40] });

        found = true;
      }
    }
  } catch (e) {
    console.warn("OSRM Fehler:", e);
  }

  /* ====== Fallback: Luftlinie NUR wenn OSRM nichts liefert ====== */
  if (!found) {
    const km = luftlinieKm(a.coord, b.coord);
    const dist = km.toFixed(1);

    const useSack = sackFilterAktiv();
    const f = werke.find(w => w.firma === a.label || w.firma === b.label);

    const preis = f ? (useSack ? f.preisSack : f.preis) : 0;

    const preisProKm = km < 250 ? 2.15 : 1.85;
    const teilstrecke = km / 24;
    const gesamt = ((teilstrecke * preisProKm) + preis) * 1.05;

    const coords = [
      [a.coord.lat, a.coord.lon],
      [b.coord.lat, b.coord.lon]
    ];

    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline(coords, {
      color:'blue',
      weight:4,
      dashArray:'8 8'
    }).addTo(map);

    const mid = [
      (a.coord.lat + b.coord.lat) / 2,
      (a.coord.lon + b.coord.lon) / 2
    ];

    L.popup()
      .setLatLng(mid)
      .setContent(`
        <b>Route:</b> ${a.label} ↔ ${b.label}<br>
        <b>Entfernung:</b> ${dist} km (Luftlinie)<br>
        <b>Preis pro km:</b> ${preisProKm.toFixed(2)} €<br>
        <b>Werk-/Sackpreis:</b> ${preis.toFixed(2)} €<br>
        <b>Gesamt (geschätzt):</b> ${gesamt.toFixed(2)} €
        <br><small>OSRM fand keine Straßenroute.</small>
      `)
      .openOn(map);

    map.fitBounds(routeLine.getBounds(), { padding: [40,40] });
  }
}



/* =====================
   KARTE-KLICK → ROUTE RESETTEN
===================== */

map.on("click", (e) => {
  const t = e.originalEvent.target;
  if (t && t.closest) {
    if (t.closest('.leaflet-marker-icon') ||
        t.closest('.leaflet-popup') ||
        t.closest('.leaflet-interactive')) return;
  }
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }
  selectedPoints = [];
  map.closePopup();
});



/* =====================
   LÄNDER-DROPDOWN
===================== */

document.addEventListener("change", (e) => {
  if (e.target.matches(".countryChk")) {

    if (e.target.value === "all" && e.target.checked) {
      document.querySelectorAll(".countryChk").forEach(ch => {
        if (ch.value !== "all") ch.checked = false;
      });
    } else if (e.target.value !== "all" && e.target.checked) {
      document.querySelector('.countryChk[value="all"]').checked = false;
    }

    updateCountryButtonLabel();
  }

  if (e.target.matches("input[type='checkbox']")) {
    updateLayers();
  }
});

function updateCountryButtonLabel() {
  const sel = getSelectedCountries();
  const btn = document.getElementById("countryDropdownBtn");

  if (sel.length === 1 && sel[0] === "all") {
    btn.textContent = "Alle Länder";
    return;
  }

  btn.textContent = sel.map(s => s.toUpperCase()).join(", ");
}



/* =====================
   DROPDOWN EIN / AUS
===================== */

document.getElementById("countryDropdownBtn")
  .addEventListener("click", () => {
    const menu = document.getElementById("countryDropdownMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  });

document.addEventListener("click", (e) => {
  const dd = document.getElementById("countryDropdown");
  if (!dd.contains(e.target)) {
    document.getElementById("countryDropdownMenu").style.display = "none";
  }
});



/* =====================
   SUCHE
===================== */

document.getElementById("searchInput")
.addEventListener("keydown", async (e) => {

  if (e.key !== "Enter") return;

  const raw = e.target.value.trim().toLowerCase();
  if (!raw) return;

  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  selectedPoints = [];

  if (searchResultMarker) {
    map.removeLayer(searchResultMarker);
    searchResultMarker = null;
  }

  const matches = alleMarker.filter(m => {
    const content = m.marker.getTooltip()?.getContent?.()?.toLowerCase() || "";
    const name = (m.firma || m.name || "").toLowerCase();
    const ort = (m.ort || "").toLowerCase();
    return content.includes(raw) || name.includes(raw) || ort.includes(raw);
  });

  const bounds = L.latLngBounds();

  matches.forEach((m, idx) => {
    const latlng = m.marker.getLatLng();
    if (!map.hasLayer(m.marker)) map.addLayer(m.marker);
    bounds.extend(latlng);
    if (idx === 0) m.marker.openTooltip();
  });

  // zusätzlich geocoden
  const geo = await geocode(raw);
  if (geo) {
    const latlng = [geo.lat, geo.lon];
    searchResultMarker = L.circleMarker(latlng, {
      radius: 8,
      color: 'blue',
      fillColor: 'blue',
      fillOpacity: 0.5
    }).addTo(map);

    searchResultMarker
      .bindPopup(`<b>${raw}</b><br>${geo.country || ""}`)
      .openPopup();

    bounds.extend(latlng);

    selectedPoints.push({
      label: raw,
      coord: { lat: geo.lat, lon: geo.lon }
    });
  }

  if (bounds.isValid()) map.fitBounds(bounds.pad(0.2));
});



/* =====================
   INITIALISIEREN
===================== */

(async () => {
  await ladeDaten();
  await buildMap();
})();
</script>
